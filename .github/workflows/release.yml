# Release from a v* tag: tests, binaries for linux/darwin/windows x amd64/arm64 with the tag as main.version, one
# GitHub release with checksums, and a multi-platform image on Docker Hub (from configs/go of the owner's standards).
# Needs secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Path filters are left out: GitHub ignores them for tags.
name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  BIN_NAME: curator
  IMAGE: mallox/curator

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir out
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "out/$BIN_NAME-$GOOS-$GOARCH$ext" .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # Tags <tag> and latest; a prerelease tag (v1.2.0-rc.1) gets no latest.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{raw}}
      # The Dockerfile cross-compiles on the runner, so arm64 needs no emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
