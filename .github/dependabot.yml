# Copy to .github/dependabot.yml. Weekly PRs keep go.sum and the workflow actions current; minor and patch updates
# are grouped, majors arrive one by one. The Dockerfile uses golang:alpine and scratch, so it has nothing to pin.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
